<aside class="drawer" role="dialog" aria-label="{% if shift %}改写焖烧班次{% else %}登记焖烧班次{% endif %}">
  <header class="drawer-head">
    <h2>{% if shift %}改写焖烧班次{% else %}登记焖烧班次{% endif %}</h2>
    <button type="button" class="icon-close" onclick="closeDrawer()" aria-label="关闭">×</button>
  </header>
  <form class="drawer-body" method="post" action="/shifts/save">
    {% if shift %}<input type="hidden" name="shift_id" value="{{ shift.id }}" />{% endif %}
    <label>炭窑
      <select name="clamp_id" required>
        {% for clamp in clamps %}
        <option value="{{ clamp.id }}" {% if preselect_clamp_id == clamp.id %}selected{% endif %}>{{ clamp.code }}</option>
        {% endfor %}
      </select>
    </label>
    <label>开始时间
      <input
        name="started_at"
        type="datetime-local"
        required
        value="{% if shift %}{{ shift.started_at|dt_input_value }}{% else %}{{ now_local_value }}{% endif %}"
      />
    </label>
    <label>峰值温度 ℃
      <input
        name="peak_temp_c"
        type="number"
        step="0.1"
        required
        value="{% if shift and shift.peak_temp_c is not none %}{{ shift.peak_temp_c }}{% endif %}"
      />
    </label>
    <label>炭品等级
      <input name="charcoal_grade" value="{{ shift.charcoal_grade if shift else 'B' }}" />
    </label>
    <label>备注
      <textarea name="notes" rows="3">{% if shift %}{{ shift.notes }}{% endif %}</textarea>
    </label>
    <p class="hint">出炭要求最近班次峰值 ≥ 400℃；校验不通过时本次写入整体作废，不留残行。</p>
    <div class="actions">
      <button type="submit">{% if shift %}保存改写{% else %}写入时间轴{% endif %}</button>
      <button type="button" class="btn ghost" onclick="closeDrawer()">取消</button>
    </div>
  </form>
</aside>
